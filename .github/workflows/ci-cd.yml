name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '20'

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    needs: test-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  deploy:
    name: Deploy (self-hosted Windows)
    # Jalur self-hosted: tidak perlu SSH/secrets — runner berada di mesin yang sama
    # dengan aplikasi. Hanya butuh label default runner Windows.
    runs-on: [self-hosted, Windows]
    needs: [test-server, test-client, build-client]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      # Tidak pakai actions/checkout: deploy bekerja langsung di folder aplikasi
      # (C:\software\insetive tracking), bukan di checkout _work milik runner.
      - name: Pull latest code
        shell: powershell
        run: |
          cd "C:\software\insetive tracking"
          git pull --ff-only origin $env:GITHUB_REF_NAME

      - name: Install server dependencies
        shell: powershell
        # shortcut: npm install (inkremental, cepat) bukan npm ci (reproducible tapi
        # wipe node_modules + rebuild better-sqlite3 tiap deploy). Ganti ke npm ci
        # kalau perlu determinisme penuh.
        run: cd "C:\software\insetive tracking\server"; npm install --no-audit --no-fund

      - name: Build client
        shell: powershell
        run: |
          cd "C:\software\insetive tracking\client"
          npm install --no-audit --no-fund
          npm run build

      - name: Restart API (PM2)
        shell: powershell
        run: pm2 restart insetive-api --update-env

      - name: Verify health
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $r = Invoke-WebRequest -Uri http://localhost:3002/api/health -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "health check failed: $($r.StatusCode)" }
          Write-Output "health OK: $($r.Content)"