# Incentive Tracking — blok nginx production.
# Sajikan build client, proxy /api ke Express (:3002).
# Ganti server_name, lalu: certbot --nginx -d <domain>

server {
    listen 80;
    listen [::]:80;
    server_name incentive.example.com;

    # Hasil `npm run build` client (lihat deploy/README.md)
    root /srv/incentive/client/dist;
    index index.html;

    # Batas sama dengan express.json({ limit: '100kb' })
    client_max_body_size 100k;

    # SPA: route React (mis. /insetif) jatuh ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health ke Express
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aset ber-hash Vite — aman di-cache lama
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
